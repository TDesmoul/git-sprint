<html>
  <head>
    <title>Git sprint</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Git & Github training</h1>
      <p>We are together to learn more about Git & Github.</p>

      <div class="section">
        <img src="https://avatars.githubusercontent.com/u/212519930?v=4" alt="">
        <p>My name is Bob. Excited about learning Git.</p>
      </div>
      <div class="section">
        <img src="https://www.google.com/imgres?q=taylor%20swift%20wallpaper&imgurl=https%3A%2F%2Fi.pinimg.com%2F736x%2F58%2F5f%2Ff3%2F585ff3ceabda1d76895acafa89810e31.jpg&imgrefurl=https%3A%2F%2Fwww.pinterest.com%2Fpin%2Ftaylor-swift-the-eras-tour-wallpaper--786159678724869309%2F&docid=qhP5M7IjboKOgM&tbnid=YPfXx_-COGJx0M&vet=12ahUKEwjy1tSrgtaQAxUDK_sDHYInKdYQM3oECEIQAA..i&w=736&h=1308&hcb=2&ved=2ahUKEwjy1tSrgtaQAxUDK_sDHYInKdYQM3oECEIQAA" alt="">
        <p>My name is Julie. Excited about learning Git.</p>
      </div>

      <h1>API testing</h1>
      <div class="section">
        <button id="chuck-btn">New quote</button>
        <div id="chuck-quote">...</div>
      </div>
    </div>
    <script>
      const chuckBtn = document.getElementById("chuck-btn")
      const chuckQuote = document.getElementById("chuck-quote")

      chuckBtn.addEventListener('click', (event) => {
        fetch("https://api.chucknorris.io/jokes/random")
        .then(response => response.json())
        .then(data => {
          console.log(data.value);
          chuckQuote.innerText = data.value;
        })
      })
    </script>
  </body>
</html>
